<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Dán lại khối <metadata> c2pa gốc của bạn vào đây nếu cần giữ -->

  <defs>
    <clipPath id="squircle">
      <rect x="57" y="47" width="1140" height="1158" rx="325"/>
    </clipPath>
    <!-- Gradient chéo: xanh lam sáng → xanh dương → tím -->
    <linearGradient id="bgGradient" gradientUnits="userSpaceOnUse" x1="57" y1="47" x2="1197" y2="1205">
      <stop offset="0" stop-color="#00b4ff"/>
      <stop offset="0.42" stop-color="#0a5cff"/>
      <stop offset="0.66" stop-color="#3d44d8"/>
      <stop offset="0.86" stop-color="#7b2dbf"/>
      <stop offset="1" stop-color="#9b46d4"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Nền gradient -->
    <rect x="0" y="0" width="1254" height="1254" fill="url(#bgGradient)"/>
  </g>

  <!-- Biểu tượng chữ Q: khung bo tròn hở góc dưới phải + các điểm ảnh (toạ độ theo hệ 512, tự scale vào squircle) -->
  <g fill="#ffffff" transform="translate(627 626) scale(2.55) translate(-256 -256)">
    <!-- Khung chính -->
    <path d="M153 107 H367 A46 46 0 0 1 413 153 V258 H358 V169 A12 12 0 0 0 346 157 H184 A32 32 0 0 0 152 189 V320 A35 35 0 0 0 187 355 H260 V412 H161 A66 66 0 0 1 95 346 V165 A58 58 0 0 1 153 107 Z"/>

    <!-- Các điểm ảnh -->
    <rect x="260" y="310" width="60" height="60"/>
    <rect x="320" y="370" width="46" height="42"/>
    <rect x="340" y="296" width="25" height="24"/>
    <rect x="366" y="336" width="34" height="32"/>
    <rect x="400" y="310" width="16" height="16" fill-opacity="0.85"/>
    <rect x="381" y="388" width="17" height="16" fill-opacity="0.85"/>
  </g>
</svg>
