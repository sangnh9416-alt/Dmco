<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#32344f">
<title>员工码 - Employee QR Pass</title>
<!-- PWA & iOS Meta Tags -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<style>
    html {
        font-size: calc(min(100vw, 430px) / 39);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    /* Tinh chỉnh nền gradient khớp chính xác với ảnh chụp thực tế */
    body {
        position: fixed;
        top: 0;
        left: 0;
        background: linear-gradient(180deg, #3d3f5c 0%, #32344f 40%, #252740 75%, #1e2036 100%);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue",
                     "Segoe UI", Roboto, "Noto Sans SC", "Microsoft YaHei", sans-serif;
        touch-action: pan-x pan-y;
    }

    /* Hình nền mờ isometric & chữ SECURITY */
    .bg-art {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 39rem;
        height: 30rem;
        margin-left: -19.5rem;
        z-index: 0;
        pointer-events: none;
    }

    .app {
        position: relative;
        z-index: 1;
        width: 39rem;
        margin: 0 auto;
        padding-top: calc(2.8rem + env(safe-area-inset-top, 0px));
    }

    .header-title {
        height: 2.4rem;
        margin-bottom: 1.9rem;
        padding: 0 0.2rem;
        font-size: 1.72rem;
        line-height: 2.4rem;
        font-weight: 400;
        color: #f6e6bd;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .qr-card {
        width: 30.2rem;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 0.4rem;
        overflow: hidden;
        -webkit-mask:
            radial-gradient(circle at 0 6.4rem, transparent 0.55rem, #000 0.6rem),
            radial-gradient(circle at 100% 6.4rem, transparent 0.55rem, #000 0.6rem);
        -webkit-mask-composite: source-in;
        mask:
            radial-gradient(circle at 0 6.4rem, transparent 0.55rem, #000 0.6rem),
            radial-gradient(circle at 100% 6.4rem, transparent 0.55rem, #000 0.6rem);
        mask-composite: intersect;
    }

    .card-banner {
        height: 6.4rem;
        line-height: 6.4rem;
        background: #e9ba45;
        color: #fdf3d6;
        font-size: 1.35rem;
        font-weight: 500;
        text-align: center;
        white-space: nowrap;
    }

    .card-body {
        padding: 1.4rem 0 0.9rem;
        text-align: center;
        background: #ffffff;
    }

    .timestamp {
        height: 2rem;
        margin-bottom: 0.5rem;
        font-size: 1.4rem;
        line-height: 2rem;
        font-weight: 600;
        color: #111111;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }

    .qr-code-box {
        width: 21.1rem;
        height: 21.1rem;
        margin: 0 auto;
        transition: opacity 0.2s ease;
    }

    .qr-code-box svg {
        display: block;
        width: 100%;
        height: 100%;
    }

    .refresh-text {
        margin-top: 0.9rem;
        height: 1.6rem;
        font-size: 1.15rem;
        line-height: 1.6rem;
        font-weight: 500;
        color: #6b6b6b;
        cursor: pointer;
    }

    .timer-display {
        margin-top: 3.6rem;
        font-size: 1.54rem;
        line-height: 2.2rem;
        font-weight: 600;
        color: #1fc84a;
        font-variant-numeric: tabular-nums;
    }

    .security-footer {
        width: 30.2rem;
        margin: 2.8rem auto 0;
        font-size: 1.28rem;
        line-height: 2rem;
        color: #f1dba4;
    }

    .security-footer p {
        text-align: justify;
        text-align-last: justify;
    }

    .security-footer .indent { text-indent: 2em; }
    .security-footer .last   { text-align-last: left; }
</style>
</head>
<body>

    <!-- Hình nền mờ tinh chỉnh theo ảnh thực tế -->
    <svg class="bg-art" viewBox="0 0 390 300" aria-hidden="true">
        <polygon points="215,40 410,115 215,190 20,115" fill="rgba(255,255,255,0.035)"/>
        <polygon points="20,115 215,190 215,212 20,137" fill="rgba(0,0,0,0.12)"/>
        <polygon points="410,115 215,190 215,212 410,137" fill="rgba(0,0,0,0.2)"/>
        <polygon points="215,62 365,115 215,168 65,115" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5"/>
        <text transform="translate(229 108) rotate(-23) scale(1 0.8)"
              text-anchor="middle" dominant-baseline="middle"
              font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
              font-size="27" font-weight="800" letter-spacing="3"
              fill="rgba(255,255,255,0.065)">SECURITY</text>
    </svg>

    <main class="app">
        <h1 class="header-title" id="empTitle">V25090015(Nguyễn Xuân Đài (DAYNE NGUYEN))</h1>

        <section class="qr-card">
            <div class="card-banner">将二维码对准扫描器刷码出场</div>

            <div class="card-body">
                <div class="timestamp" id="liveTimestamp">2026-10-13  18:50:45</div>

                <div class="qr-code-box" id="qrBox">
                    <svg viewBox="0 0 61 61" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
                        <rect width="61" height="61" fill="#ffffff"/>
                        <path id="qrPath" fill="#000000" d=""/>
                    </svg>
                </div>

                <div class="refresh-text" id="refreshBtn">刷新二维码</div>

                <div class="timer-display" id="countUpTimer">05:58:34</div>
            </div>
        </section>

        <div class="security-footer">
            <p class="indent">尊敬的员工您好，您已进入企业涉密区域，出</p>
            <p>于企业安全考虑，您的手机摄像头将被禁止拍摄，感</p>
            <p class="last">谢您的配合。</p>
        </div>
    </main>

    <script>
        const pad = (n) => String(n).padStart(2, "0");
        const N = 61;

        function mulberry32(a) {
            return function () {
                a |= 0; a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function buildMatrix(seed) {
            const rnd = mulberry32(seed);
            const m = [], fixed = [];
            for (let i = 0; i < N; i++) {
                m.push(new Array(N).fill(0));
                fixed.push(new Array(N).fill(false));
            }
            const put = (r, c, v) => {
                if (r >= 0 && r < N && c >= 0 && c < N) { m[r][c] = v ? 1 : 0; fixed[r][c] = true; }
            };

            [[0, 0], [0, N - 7], [N - 7, 0]].forEach(([r0, c0]) => {
                for (let r = -1; r <= 7; r++) {
                    for (let c = -1; c <= 7; c++) {
                        const inside = r >= 0 && r <= 6 && c >= 0 && c <= 6;
                        const dark = inside && (r === 0 || r === 6 || c === 0 || c === 6 ||
                                     (r >= 2 && r <= 4 && c >= 2 && c <= 4));
                        put(r0 + r, c0 + c, dark);
                    }
                }
            });

            for (let i = 8; i < N - 8; i++) { put(6, i, i % 2 === 0); put(i, 6, i % 2 === 0); }

            const A = [6, 30, 54];
            A.forEach((r) => A.forEach((c) => {
                if ((r === 6 && c === 6) || (r === 6 && c === 54) || (r === 54 && c === 6)) return;
                for (let dr = -2; dr <= 2; dr++)
                    for (let dc = -2; dc <= 2; dc++)
                        put(r + dr, c + dc, Math.max(Math.abs(dr), Math.abs(dc)) !== 1);
            }));

            put(N - 8, 8, 1);

            for (let r = 0; r < N; r++)
                for (let c = 0; c < N; c++)
                    if (!fixed[r][c]) m[r][c] = rnd() < 0.5 ? 1 : 0;

            return m;
        }

        function renderQR() {
            const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
            const m = buildMatrix(seed);
            let d = "";
            for (let r = 0; r < N; r++) {
                let c = 0;
                while (c < N) {
                    if (m[r][c]) {
                        const s = c;
                        while (c < N && m[r][c]) c++;
                        d += `M${s} ${r}h${c - s}v1h-${c - s}z`;
                    } else c++;
                }
            }
            document.getElementById("qrPath").setAttribute("d", d);
        }

        let totalSeconds = 21514; // Khởi tạo mốc hiển thị sẵn 05:58:34 khớp ảnh
        const timerEl = document.getElementById("countUpTimer");

        function updateCountUpTimer() {
            const h = Math.floor(totalSeconds / 3600);
            const mi = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;

            timerEl.textContent = pad(h) + ":" + pad(mi) + ":" + pad(s);
            totalSeconds = (totalSeconds + 1) % 86400;
        }

        updateCountUpTimer();
        setInterval(updateCountUpTimer, 1000);

        const tsEl = document.getElementById("liveTimestamp");
        function updateLiveDateTime() {
            const n = new Date();
            tsEl.textContent =
                `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}\u00A0\u00A0` +
                `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
        }
        setInterval(updateLiveDateTime, 1000);
        updateLiveDateTime();

        function refreshQR() {
            const box = document.getElementById("qrBox");
            box.style.opacity = "0.3";
            setTimeout(() => {
                renderQR();
                box.style.opacity = "1";
                updateLiveDateTime();
            }, 200);
        }
        document.getElementById("refreshBtn").addEventListener("click", refreshQR);
        renderQR();

        document.addEventListener("gesturestart", (e) => e.preventDefault());
        document.addEventListener("touchmove", (e) => {
            if (e.scale !== 1) e.preventDefault();
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener("touchend", (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
