<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>员工码 - Employee QR Pass</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: #121424;
            background-image: linear-gradient(135deg, #242746 0%, #17192f 50%, #0e101f 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: pan-x pan-y;
        }

        /* Container chính */
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 16px;
            position: relative;
            z-index: 2;
        }

        /* Tiêu đề trên cùng */
        .header-title {
            font-size: 17px;
            font-weight: 500;
            color: #dcdde1;
            text-align: center;
            margin-top: 15px;
            margin-bottom: 24px;
            letter-spacing: 0.2px;
        }

        /* Thẻ QR Card */
        .qr-card {
            width: 100%;
            background-color: #ffffff;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        /* Phần banner vàng phía trên */
        .card-banner {
            width: 100%;
            background-color: #f1c40f;
            color: #333333;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            padding: 16px 10px;
            position: relative;
        }

        /* Vết cắt bán nguyệt (Notches) ở hai bên mép thẻ */
        .card-notch-left, .card-notch-right {
            position: absolute;
            top: 50px;
            width: 20px;
            height: 20px;
            background-color: #16182d;
            border-radius: 50%;
            z-index: 3;
        }
        .card-notch-left {
            left: -10px;
        }
        .card-notch-right {
            right: -10px;
        }

        /* Nội dung bên trong thẻ trắng */
        .card-body {
            width: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 22px 20px 28px 20px;
        }

        /* Thời gian thực hiện tại (Timestamp trên QR) */
        .timestamp {
            font-size: 16px;
            color: #111111;
            font-weight: 500;
            margin-bottom: 14px;
        }

        /* Khung chứa mã QR */
        .qr-code-box {
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .qr-code-box svg {
            width: 100%;
            height: 100%;
        }

        /* Nút làm mới QR */
        .refresh-text {
            font-size: 15px;
            color: #333333;
            margin-bottom: 18px;
            cursor: pointer;
        }

        /* Đồng hồ đếm lên (Count-up timer) màu xanh lá */
        .timer-display {
            font-size: 24px;
            font-weight: bold;
            color: #2ecc71;
            letter-spacing: 1px;
        }

        /* Footer cảnh báo bảo mật */
        .security-footer {
            width: 100%;
            max-width: 440px;
            text-align: center;
            font-size: 12.5px;
            line-height: 1.5;
            color: #95a5a6;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        /* Watermark chữ SECURITY mờ ở nền dưới */
        .bg-watermark {
            position: absolute;
            bottom: 40px;
            font-size: 75px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.025);
            letter-spacing: 10px;
            z-index: 1;
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="bg-watermark">SECURITY</div>

    <div class="app-container">
        <!-- Tiêu đề trên cùng -->
        <div class="header-title">V25080120(Nguyễn Hữu Sang)</div>

        <!-- Thẻ chính chứa QR -->
        <div class="qr-card">
            <div class="card-notch-left"></div>
            <div class="card-notch-right"></div>

            <div class="card-banner">
                将二维码对准扫描器刷码出场
            </div>

            <div class="card-body">
                <!-- Ngày giờ thời gian thực -->
                <div class="timestamp" id="liveTimestamp">2026-10-13 18:50:45</div>

                <!-- QR Code SVG -->
                <div class="qr-code-box">
                    <svg viewBox="0 0 33 33" shape-rendering="crispEdges">
                        <rect width="33" height="33" fill="#ffffff"/>
                        <!-- Mẫu giả lập QR chuẩn -->
                        <path fill="#000000" d="M0,0h7v7H0z M1,1v5h5V1z M2,2h3v3H2z M26,0h7v7H26z M27,1v5h5V1z M28,2h3v3H28z M0,26h7v7H0z M1,27v5h5V27z M2,28h3v3H2z M10,1h2v1h-2z M14,0h2v2h-2z M18,1h1v2h-1z M22,0h2v1h-2z M8,4h2v2h-2z M13,3h2v1h-2z M17,4h3v1h-3z M21,3h2v2h-2z M4,8h1v2h-1z M7,9h2v1h-2z M11,8h2v2h-2z M15,8h1v3h-1z M18,8h2v2h-2z M23,8h1v2h-1z M26,9h2v1h-2z M30,8h2v2h-2z M1,11h2v2H1z M6,11h2v1H6z M9,12h2v2H9z M13,12h2v1h-1z M17,12h1v2h-1z M21,11h2v2H21z M25,12h2v1h-2z M28,11h3v2H28z M0,15h3v2H0z M5,15h2v2H5z M9,15h1v2H9z M12,15h2v2H12z M15,15h2v2H15z M19,15h2v2H19z M23,15h1v2H23z M27,15h3v2H27z M31,15h2v2H31z M2,19h2v1H2z M7,18h2v2H7z M11,18h1v2H11z M14,19h2v2H14z M17,18h2v2H17z M21,19h2v2H21z M24,18h2v2H24z M28,19h1v2H1z M30,18h2v2H30z M0,22h2v2H0z M4,22h2v2H4z M8,22h1v2H8z M12,22h2v2H12z M16,22h1v2H16z M19,22h2v2H19z M23,22h2v2H23z M27,22h1v2H27z M30,22h2v2H30z M9,25h2v2H9z M13,25h2v2H13z M17,25h1v2H17z M21,25h2v2H21z M25,25h1v2H25z M4,29h2v2H4z M8,29h2v2H8z M14,29h1v2H14z M18,29h2v2H18z M23,29h2v2H23z M27,29h2v2H27z"/></svg>
                </div>

                <!-- Nút làm mới chữ nhỏ -->
                <div class="refresh-text" onclick="refreshQR()">刷新二维码</div>

                <!-- Đồng hồ đếm lên (00:00:00 -> 23:59:59) -->
                <div class="timer-display" id="countUpTimer">00:00:00</div>
            </div>
        </div>

        <!-- Cảnh báo bảo mật cuối trang -->
        <div class="security-footer">
            尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。
        </div>
    </div>

    <script>
        // Khởi tạo bộ đếm thời gian đếm lên bắt đầu từ 00:00:00
        let totalSeconds = 0;

        function pad(val) {
            return val > 9 ? val : "0" + val;
        }

        // Cập nhật đồng hồ đếm lên mỗi giây và tự vòng lại khi qua 24h
        setInterval(() => {
            totalSeconds++;
            if (totalSeconds >= 86400) { // 24 giờ * 3600 giây
                totalSeconds = 0;
            }

            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;

            document.getElementById("countUpTimer").innerText = 
                pad(hours) + ":" + pad(minutes) + ":" + pad(seconds);
        }, 1000);

        // Cập nhật thời gian thực ngày giờ trên QR code
        function updateLiveDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = pad(now.getMonth() + 1);
            const day = pad(now.getDate());
            const h = pad(now.getHours());
            const m = pad(now.getMinutes());
            const s = pad(now.getSeconds());

            document.getElementById("liveTimestamp").innerText = `${year}-${month}-${day} ${h}:${m}:${s}`;
        }
        setInterval(updateLiveDateTime, 1000);
        updateLiveDateTime();

        // Hiệu ứng bấm làm mới mã QR
        function refreshQR() {
            const qrBox = document.querySelector('.qr-code-box');
            qrBox.style.opacity = '0.3';
            setTimeout(() => {
                qrBox.style.opacity = '1';
                updateLiveDateTime();
            }, 200);
        }

        // Chặn hoàn toàn các sự kiện zoom / thu phóng trên mobile & desktop
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });
        document.addEventListener('touchmove', function (e) {
            if (e.scale !== 1) {
                e.preventDefault();
            }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
